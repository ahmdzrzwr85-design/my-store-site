services:
  - type: web
    name: zar-zor-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:generate && npm run api:build
    startCommand: npm run db:deploy && npm run api:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WEB_ORIGIN
        sync: false
